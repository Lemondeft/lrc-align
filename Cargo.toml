[package]
name = "lrc-align"
version = "0.1.0"
edition = "2024"
description = "Accurate word-by-word Enhanced LRC & WLRC forced aligner with a localhost Colab-style web UI"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hf-hub = { version = "1.0.0", features = ["rustls-tls"] }
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
lofty = "0.25.5"
realfft = "3.5.1"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rubato = "5.1.0"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.6.1", features = ["all"] }
tempfile = "3.20"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.16", features = ["v4"] }

[dependencies.candle-core]
version = "0.11.1"

[dependencies.candle-nn]
version = "0.11.1"

[dependencies.candle-transformers]
version = "0.11.1"

[profile.release]
lto = "thin"
codegen-units = 1
